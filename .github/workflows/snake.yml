name: Generate contribution snake

on:
  schedule:
    - cron: "23 2 * * *" # daily, off-peak
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/profile/snake.svg?color_snake=%23a06a35&color_dots=%23e3eaee,%23c3d4da,%238fb9c2,%2355919d,%232e7883
            assets/profile/snake-dark.svg?color_snake=%23d9b47e&color_dots=%231f2a30,%232f4a52,%233c7078,%2355a0a5,%237fd0c8

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile/snake.svg assets/profile/snake-dark.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: regenerate contribution snake"
            git push
          fi
